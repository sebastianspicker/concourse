# Runs the development BFF with the public HfMT pack on the standard local port.
services:
  bff:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - BFF_PORT=4000
      - INSTITUTION_ID=hfmt
      - CORS_ORIGINS=http://localhost:8081,http://localhost:19006
