name: codeql

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'AGENTS.md'
      - 'archive/**'
      - 'docs/archive/**'
      - 'node_modules/**'
      - 'vendor/**'
      - 'third_party/**'
      - 'third-party/**'
      - '3rdparty/**'
      - 'external/**'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'archive/**'
      - 'docs/archive/**'
      - 'node_modules/**'
      - 'vendor/**'
      - 'third_party/**'
      - 'third-party/**'
      - '3rdparty/**'
      - 'external/**'
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@38697555549f1db7851b81482ff19f1fa5c4fedc # v3
        with:
          languages: javascript
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@38697555549f1db7851b81482ff19f1fa5c4fedc # v3
