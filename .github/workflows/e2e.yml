name: E2E Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/mobile/**'
      - 'apps/bff/**'
      - 'packages/shared/**'
      - 'packages/institutions/**'
      - 'scripts/e2e-bff.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/mobile/**'
      - 'apps/bff/**'
      - 'packages/shared/**'
      - 'packages/institutions/**'
      - 'scripts/e2e-bff.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  service:
    name: BFF HTTP E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack (pnpm@9.0.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BFF E2E tests
        run: pnpm test:e2e

  native-projects:
    name: Detect native projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.detect.outputs.ios }}
      android: ${{ steps.detect.outputs.android }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Detect native project directories
        id: detect
        run: |
          if find apps/mobile -maxdepth 3 -name '*.xcworkspace' | grep -q .; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f apps/mobile/android/gradlew ] || [ -f apps/mobile/android/build.gradle ] || [ -f apps/mobile/android/settings.gradle ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS E2E Tests
    needs: native-projects
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ needs.native-projects.outputs.ios == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack (pnpm@9.0.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Cache Detox
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/detox
            ~/Library/Detox/ios
          key: ${{ runner.os }}-detox-${{ hashFiles('**/detox.config.js') }}
          restore-keys: |
            ${{ runner.os }}-detox-

      - name: Build iOS app
        working-directory: apps/mobile
        run: pnpm test:e2e:build:ios

      - name: Run iOS E2E tests
        working-directory: apps/mobile
        run: pnpm test:e2e:ios --record-videos failing --record-logs all

      - name: Upload test artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: ios-test-artifacts
          path: |
            apps/mobile/artifacts/
            apps/mobile/detox-artifacts/
          retention-days: 7

  android:
    name: Android E2E Tests
    needs: native-projects
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ needs.native-projects.outputs.android == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack (pnpm@9.0.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Cache Detox
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/detox
            ~/.android/avd
          key: ${{ runner.os }}-detox-android-${{ hashFiles('**/detox.config.js') }}
          restore-keys: |
            ${{ runner.os }}-detox-android-

      - name: Create Android Emulator
        uses: reactivecircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586 # v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_5_API_33
          script: echo "Emulator created"

      - name: Build Android app
        working-directory: apps/mobile
        run: pnpm test:e2e:build:android

      - name: Run Android E2E tests
        uses: reactivecircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586 # v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_5_API_33
          script: cd apps/mobile && pnpm test:e2e:android --record-videos failing --record-logs all

      - name: Upload test artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: android-test-artifacts
          path: |
            apps/mobile/artifacts/
            apps/mobile/detox-artifacts/
          retention-days: 7

  # Summary job that reports overall status
  e2e-summary:
    name: E2E Tests Summary
    needs: [service, native-projects, ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check test results
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_PROJECT_DETECTED: ${{ needs.native-projects.outputs.android }}
          IOS_RESULT: ${{ needs.ios.result }}
          IOS_PROJECT_DETECTED: ${{ needs.native-projects.outputs.ios }}
          SERVICE_RESULT: ${{ needs.service.result }}
        run: |
          if [ "$IOS_RESULT" == "failure" ] || [ "$ANDROID_RESULT" == "failure" ]; then
            echo "E2E tests failed"
            exit 1
          fi
          if [ "$SERVICE_RESULT" == "failure" ]; then
            echo "BFF E2E tests failed"
            exit 1
          fi
          if [ "$IOS_RESULT" == "cancelled" ] || [ "$ANDROID_RESULT" == "cancelled" ]; then
            echo "E2E tests were cancelled"
            exit 1
          fi
          if [ "$SERVICE_RESULT" == "cancelled" ]; then
            echo "BFF E2E tests were cancelled"
            exit 1
          fi
          if [ "$IOS_PROJECT_DETECTED" != "true" ] && [ "$ANDROID_PROJECT_DETECTED" != "true" ]; then
            echo "No native iOS or Android project is checked in; skipping Detox E2E."
          fi
          if [ "$SERVICE_RESULT" == "success" ]; then
            echo "BFF E2E tests passed"
          fi
          if [ "$SERVICE_RESULT" == "skipped" ] && [ "$IOS_RESULT" == "skipped" ] && [ "$ANDROID_RESULT" == "skipped" ]; then
            echo "No E2E target ran"
            exit 0
          fi
          echo "All E2E tests passed"
