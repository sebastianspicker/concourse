# Blocks pull requests that introduce known vulnerabilities into the frozen lockfile.
name: dependency-review

on:
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: --lockfile=pnpm-lock.yaml
      upload-sarif: false
      fail-on-vuln: true
