name: Feature request
description: Suggest an improvement to the public template
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What have you tried or considered?
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where does this belong?
      options:
        - Public template
        - Private fork only
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Public/private boundary
      options:
        - label: This request does not require secrets, protected institution systems, private endpoints, or real SSO in the public repo.
          required: true
