# Captures reproducible public-template defects without soliciting private campus data.
name: Bug report
description: Report a reproducible Concourse defect
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only the relevant log excerpt. Redact secrets, tokens, private URLs, student data, and internal institution details.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Exact tag, package version, or commit tested
      placeholder: 1.2.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Client
        - API
        - Public contracts
        - Institution packs
        - Public connectors
        - Documentation
        - CI / tooling
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node, pnpm, Expo version (if relevant)
      placeholder: macOS 15, Node 22.13.0, pnpm 9.x, Expo SDK 57
    validations:
      required: false
  - type: checkboxes
    id: public-safety
    attributes:
      label: Public repo safety
      options:
        - label: I removed secrets, credentials, private endpoints, internal URLs, and personal data from this report.
          required: true
